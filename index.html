<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buses Trips</title>

  <!-- Fuente moderna -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;700&display=swap" rel="stylesheet">

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:'Poppins', sans-serif;
    }

    body{
      background: linear-gradient(135deg, #001d3d, #003566, #0a9396);
      min-height:100vh;
      color:white;
      overflow-x:hidden;
    }

    /* HEADER */

    header{
      text-align:center;
      padding:50px 20px;
      background: rgba(0,0,0,0.35);
      backdrop-filter: blur(10px);
      border-bottom:2px solid rgba(255,255,255,0.1);
      box-shadow:0 8px 20px rgba(0,0,0,0.3);
    }

    header h1{
      font-size:4rem;
      letter-spacing:3px;
      text-transform:uppercase;
      color:#ffd60a;
      text-shadow:0 0 15px rgba(255,214,10,0.8);
      animation: brillo 2s infinite alternate;
    }

    @keyframes brillo{
      from{
        text-shadow:0 0 10px #ffd60a;
      }
      to{
        text-shadow:0 0 30px #ffd60a;
      }
    }

    header p{
      margin-top:10px;
      font-size:1.2rem;
      color:#e9ecef;
    }

    /* BOTONES */

    nav{
      display:flex;
      justify-content:center;
      gap:30px;
      margin:40px 20px;
      flex-wrap:wrap;
    }

    nav button{
      padding:18px 40px;
      border:none;
      border-radius:50px;
      font-size:1.1rem;
      font-weight:bold;
      cursor:pointer;
      color:white;
      background: linear-gradient(45deg, #ff006e, #8338ec);
      box-shadow:0 10px 20px rgba(0,0,0,0.3);
      transition:0.4s;
      position:relative;
      overflow:hidden;
    }

    nav button::before{
      content:"";
      position:absolute;
      width:0;
      height:100%;
      background:rgba(255,255,255,0.2);
      left:0;
      top:0;
      transition:0.4s;
    }

    nav button:hover::before{
      width:100%;
    }

    nav button:hover{
      transform:translateY(-6px) scale(1.05);
      box-shadow:0 15px 25px rgba(0,0,0,0.5);
    }

    /* TARJETA PRINCIPAL */

    .contenido{
      width:85%;
      max-width:1000px;
      margin:auto;
      background:rgba(255,255,255,0.12);
      backdrop-filter:blur(12px);
      border-radius:25px;
      padding:40px;
      box-shadow:0 15px 35px rgba(0,0,0,0.35);
      border:1px solid rgba(255,255,255,0.15);
      animation:aparecer 1s ease;
    }

    @keyframes aparecer{
      from{
        opacity:0;
        transform:translateY(30px);
      }
      to{
        opacity:1;
        transform:translateY(0);
      }
    }

    .contenido h2{
      text-align:center;
      margin-bottom:20px;
      font-size:2.8rem;
      color:#ffd60a;
    }

    .contenido p{
      font-size:1.1rem;
      line-height:1.8;
      color:#f8f9fa;
      text-align:justify;
    }

    /* IMAGENES */

    img{
      width:100%;
      margin-top:25px;
      border-radius:20px;
      max-height:450px;
      object-fit:cover;
      transition:0.5s;
      box-shadow:0 10px 25px rgba(0,0,0,0.4);
    }

    img:hover{
      transform:scale(1.02);
    }

    /* SOLICITUD */

    .solicitud{
      margin-top:40px;
      text-align:center;
    }

    .solicitud h3{
      font-size:2rem;
      margin-bottom:20px;
      color:#ffd60a;
    }

    textarea{
      width:100%;
      height:150px;
      border:none;
      border-radius:20px;
      padding:20px;
      font-size:1rem;
      resize:none;
      outline:none;
      background:rgba(255,255,255,0.15);
      color:white;
      box-shadow: inset 0 0 10px rgba(0,0,0,0.2);
    }

    textarea::placeholder{
      color:#ddd;
    }

    /* BOTON ENVIAR */

    .enviar{
      margin-top:25px;
      padding:15px 40px;
      border:none;
      border-radius:50px;
      background: linear-gradient(45deg, #06d6a0, #118ab2);
      color:white;
      font-size:1.1rem;
      font-weight:bold;
      cursor:pointer;
      transition:0.4s;
      box-shadow:0 10px 20px rgba(0,0,0,0.3);
    }

    .enviar:hover{
      transform:scale(1.08);
      box-shadow:0 15px 25px rgba(0,0,0,0.5);
    }

    /* FOOTER */

    footer{
      margin-top:50px;
      text-align:center;
      padding:25px;
      background:rgba(0,0,0,0.3);
      color:#ddd;
      font-size:1rem;
      backdrop-filter:blur(10px);
    }

    /* RESPONSIVE */

    @media(max-width:768px){

      header h1{
        font-size:2.5rem;
      }

      .contenido{
        width:92%;
        padding:25px;
      }

      .contenido h2{
        font-size:2rem;
      }

      nav button{
        width:100%;
      }
    }
.logo{
  width:180px;
  height:180px;
  object-fit:cover;
  border-radius:50%;
  margin-bottom:20px;
  border:4px solid rgba(255,255,255,0.3);
  box-shadow:0 10px 25px rgba(0,0,0,0.4);
}
  </style>
</head>

<body>

  <header>
    <img src="1000069578.jpg" class="logo">
    <h1>Los de la corona</h1>
    <p>Algo bello, algo VIP ✈️🌴</p>
  </header>

  <nav>
<button onclick="mostrarLugar('quintana')">
  Querétaro
</button>

    <button onclick="mostrarLugar('acapulco')">
      Acapulco
    </button>

    <button onclick="mostrarLugar('yucatan')">
      Yucatán
    </button>
  </nav>

  <div class="contenido" id="info">

    <h2>¡Bienvenido!</h2>

    <p>
      Explora destinos increíbles de México con Buses Trips.
      Selecciona un lugar para descubrir información turística,
      imágenes espectaculares y solicitar tu próximo viaje.
    </p>

  </div>

  <footer>
    León S. Matías | Buses Trips © 2026
  </footer>

  <script>

    function mostrarLugar(lugar){

      const info = document.getElementById("info");

if(lugar === "quintana"){

  info.innerHTML = `

    <h2>Querétaro 🏛️</h2>

    <p>
      Querétaro es uno de los estados más importantes del centro de México.
      Destaca por su gran riqueza histórica, arquitectura colonial y
      desarrollo moderno. Su capital, Santiago de Querétaro, cuenta con un
      hermoso centro histórico declarado Patrimonio de la Humanidad.
      También son muy populares sus viñedos, pueblos mágicos como Bernal
      y atractivos naturales ideales para el turismo.
    </p>

    <img src="https://th.bing.com/th/id/R.e73f95b19545ea678a2b16b3409c45ad?rik=FJ%2fGQTva5XNrjA&pid=ImgRaw&r=0">

    <div class="solicitud">

      <h3>Haz tu solicitud ✈️</h3>

      <textarea id="mensaje"
      placeholder="Escribe aquí tu solicitud de viaje..."></textarea>

      <button class="enviar" onclick="enviarCorreo()">
        Enviar Solicitud
      </button>

    </div>
  `;
}

      else if(lugar === "acapulco"){

        info.innerHTML = `

          <h2>Acapulco 🌊</h2>

          <p>
            Acapulco es uno de los destinos de playa más famosos de México.
            Se encuentra en el estado de Guerrero y es reconocido por sus
            hermosas bahías, clima tropical y espectáculos de clavados en
            La Quebrada.
            Es un lugar perfecto para disfrutar del mar, comida típica
            y actividades turísticas.
          </p>

          <img src="https://www.tripsavvy.com/thmb/_d7pikwxxnJ0KxlAL7S974ZqGgs=/2127x1409/filters:no_upscale():max_bytes(150000):strip_icc()/GettyImages-483459092-65bffc6db2ca45e5a5907614af5a4597.jpg">

          <div class="solicitud">

            <h3>Haz tu solicitud ✈️</h3>

            <textarea id="mensaje"
            placeholder="Escribe aquí tu solicitud de viaje..."></textarea>

            <button class="enviar" onclick="enviarCorreo()">
              Enviar Solicitud
            </button>

          </div>
        `;
      }
      else if(lugar === "yucatan"){

        info.innerHTML = `

          <h2>Yucatán 🌄</h2>

          <p>
      Yucatán es uno de los estados más culturales y turísticos de México.
      Es famoso por sus zonas arqueológicas mayas como Chichén Itzá,
      sus cenotes naturales y la hermosa ciudad de Mérida.
      También destaca por su gastronomía tradicional y su historia.
          </p>

          <img src="https://images.trvl-media.com/place/6052401/cb4e720c-c35a-40e4-b531-c3317f1a4a1a.jpg">

          <div class="solicitud">

            <h3>Haz tu solicitud ✈️</h3>

            <textarea id="mensaje"
            placeholder="Escribe aquí tu solicitud de viaje..."></textarea>

            <button class="enviar" onclick="enviarCorreo()">
              Enviar Solicitud
            </button>

          </div>
        `;
      }  
    }

    function enviarCorreo(){

      let mensaje = document.getElementById("mensaje").value;

      let correo = "matiextra2013@gmail.com";

      let correo2= "fantochesvip@gmail.com"

      let asunto = "Solicitud de viaje - Buses Trips";

      window.location.href =
      `mailto:${correo}?subject=${encodeURIComponent(asunto)}&body=${encodeURIComponent(mensaje)}`;

      window.location.href =
      `mailto:${correo2}?subject=${encodeURIComponent(asunto)}&body=${encodeURIComponent(mensaje)}`;

    }

  </script>

</body>
</html>
